name: Documentation Alpha

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Verify documentation contracts
        run: npm run check:documentation

      - name: Build Vite application
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Python audit script
        run: python -m py_compile scripts/audit-animal-friends.py

      - name: Run non-authoritative Animal Friends pre-audit
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python scripts/audit-animal-friends.py --output /tmp/animal-friends-audit.json

      - name: Upload technical asset audit
        uses: actions/upload-artifact@v4
        with:
          name: animal-friends-technical-audit
          path: /tmp/animal-friends-audit.json
          if-no-files-found: error
          retention-days: 14
